name: Release JARVIS MARK 2

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable
        run: |
          python build_exe.py

      - name: Archive Build Artifacts
        run: |
          powershell Compress-Archive -Path dist/JARVIS-Mark-II/* -DestinationPath JARVIS-Mark-II-Windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "JARVIS MARK 2 ${{ github.ref_name }}"
          body: |
            ## JARVIS MARK 2 Protocol Release
            
            Autonomous Multimodal AI Assistant with Movie-Accurate Holographic HUD.
            
            ### Included Features:
            - **Cinematic Holographic HUD**: 3D Celestial Reactor core, depth-sorted particle swarm, digital chronometer, and real GPS tactical map.
            - **Model-Agnostic Coding Engine**: Dedicated coding API pipeline (DeepSeek, OpenAI-compatible, custom endpoints) with zero hardcoded model strings.
            - **Gemini Live Permanent Voice**: High-fidelity conversational loop permanently anchored to Gemini Live with deeper vocal profiles (Fenrir & Charon).
            - **Smart Anti-Noise Interruption**: 3-layer sustained speech gating (~256ms voice hold) preventing accidental interruptions from clicks, taps, or fan noise.
            - **Expanded Long-Term Memory**: Deep prompt memory injection and multi-category persistent recall without token starvation.
            - **Upgrade Awareness**: First-boot automatic upgrade acknowledgment upon every new release.
            - **Zero Key Leak Security**: Protected configurations and sanitized releases ensuring complete API key safety.
            
            ### Quick Start:
            1. Download and extract `JARVIS-Mark-II-Windows-x64.zip`.
            2. Launch `JARVIS-Mark-II.exe`.
          files: |
            JARVIS-Mark-II-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
